<!doctype html>
<html lang="en" dir="ltr" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050f0b" />
    <meta name="description" content="Qari Studio — recite the Holy Quran in your own voice with live headphone monitoring, natural vocal enhancement and a private recordings library." />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Qari Studio" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Qari Studio</title>
    <script>
      // Apply the saved theme and language before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('qari-settings') || '{}').state || {};
        var th = s.theme || 'midnight';
        if (th === 'system') th = matchMedia('(prefers-color-scheme: light)').matches ? 'ivory' : 'midnight';
        document.documentElement.dataset.theme = th;
        var lang = s.language || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
    <style>
      html { background: #050f0b; }
      html[data-theme='ivory'] { background: #f5f0e3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Qari Studio needs JavaScript to record and process audio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
